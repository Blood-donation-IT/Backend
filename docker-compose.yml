services:
  user-profile:
    build:
      context: .
      dockerfile: ./services/user_profile/Dockerfile
    container_name: user-profile
    depends_on:
      - user-profile-db
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@user-profile-db:5432/user_profile_db
      - PYTHONPATH=/app/service/src
      - REPOSITORY_TYPE=postgresql
      - ID_GENERATOR_TYPE=snowflake
    ports:
      - "5001:50051"
    networks:
      - user-profile_net
      - gateway_net
    platform: linux/amd64

  api-gateway:
    build:
      context: .
      dockerfile: ./services/api_gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=BloodDonorGateway
      - USER_SERVICE_HOST=user-profile
      - USER_SERVICE_PORT=50051
      - APPLICATION_MANAGEMENT_SERVICE_HOST=application-management
      - APPLICATION_MANAGEMENT_SERVICE_PORT=50052
      - AUTHORIZATION_SERVICE_HOST=authorization
      - AUTHORIZATION_SERVICE_PORT=50053
      - SECRET_KEY=blood-don
    depends_on:
      - user-profile
      - application-management
      - authorization
    networks:
      - gateway_net

  user-profile-db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: user_profile_db
    volumes:
      - user-profile-data:/var/lib/postgresql/data
    networks:
      - user-profile_net
    ports:
      - "5433:5432"
  
  # user-profile-migrations:
  #   build:
  #     context: .
  #     dockerfile: ./services/user_profile_migrations/Dockerfile
  #   depends_on:
  #     - user-profile-db
  #   environment:
  #     - DATABASE_URL=postgresql+psycopg2://user:password@user-profile-db:5432/user_profile_db
  #   networks:
  #     - user-profile_net


  grpc-sandbox:
    build:
      context: .
      dockerfile: ./services/grpc_sandbox/Dockerfile
    container_name: grpc-sandbox
    # depends_on:
    #    - user-profile
         
      
    networks:
      - gateway_net
      - user-profile_net

  application-management:
    build:
      context: .
      dockerfile: ./services/application-management/Dockerfile
    container_name: application-management
    depends_on:
      - application-management-db
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@application-management-db:5432/application_management_db
      - PYTHONPATH=/app/service/src
      - REPOSITORY_TYPE=postgresql
      - ID_GENERATOR_TYPE=snowflake
    ports:
      - "5002:50052"  
    networks:
      - application_management_net
      - gateway_net

  application-management-db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: application_management_db
    volumes:
      - application-management-data:/var/lib/postgresql/data
    networks:
      - application_management_net
    ports:
      - "5434:5432"

  authorization:
    build:
      context: .
      dockerfile: ./services/authorization/Dockerfile
    container_name: authorization
    depends_on:
      - authorization-db
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@authorization-db:5432/authorization_db
      - PYTHONPATH=/app/service/src
      - REPOSITORY_TYPE=postgresql
      - ID_GENERATOR_TYPE=snowflake
    ports:
      - "5003:50053"  
    networks:
      - authorization_net
      - gateway_net

  authorization-db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: authorization_db
    volumes:
      - authorization-data:/var/lib/postgresql/data
    networks:
      - authorization_net
    ports:
      - "5435:5432"

  admin-dashboard:
    build:
      context: .
      dockerfile: ./services/admin-dashboard/Dockerfile
    container_name: admin-dashboard
    depends_on:
      - authorization-db
      - user-profile-db
      - application-management-db
    environment:
      - SECRET_KEY=admin-dashboard-secret-key
      - AUTHORIZATION_DATABASE_URL=postgresql://user:password@authorization-db:5432/authorization_db
      - USER_PROFILE_DATABASE_URL=postgresql://user:password@user-profile-db:5432/user_profile_db
      - APPLICATION_MANAGEMENT_DATABASE_URL=postgresql://user:password@application-management-db:5432/application_management_db
      - PYTHONPATH=/app/service/src:/app/libs
    ports:
      - "5000:5000"
    networks:
      - authorization_net
      - user-profile_net
      - application_management_net
    platform: linux/amd64

  # authorization-migrations:
  #   build:
  #     context: .
  #     dockerfile: ./services/authorization_migrations/Dockerfile
  #   depends_on:
  #     - authorization-db
  #   environment:
  #     - DATABASE_URL=postgresql+psycopg2://user:password@authorization-db:5432/authorization_db
  #   networks:
  #     - authorization_net
  
volumes:
  user-profile-data:
  application-management-data:
  authorization-data:

networks:
  user-profile_net:
  gateway_net:
  application_management_net:
  authorization_net: