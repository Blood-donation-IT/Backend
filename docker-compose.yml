services:
  user-profile:
    build:
      context: .
      dockerfile: ./services/user-profile/Dockerfile
    container_name: user-profile
    depends_on:
      - user-profile-db
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@user-profile-db:5432/user_profile_db
      - PYTHONPATH=/app/service/src
    ports:
      - "5001:50051"
    networks:
      - user-profile_net
      - gateway_net

  user-profile-db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: user_profile_db
    volumes:
      - user-profile-data:/var/lib/postgresql/data
    networks:
      - user-profile_net

volumes:
  user-profile-data:

networks:
  user-profile_net:
  gateway_net: